spring.application.name=notification-service
server.port=8085

# The SHARED database. notification-service keeps ddl-auto=update for its five
# notification_* tables because notification-dal is on no other service's
# classpath -- nothing else maps them, so there is no DDL race to lose.
# (This file previously pointed at Neon, unlike the other four services;
#  the shared Neon datasource now lives in application-dev.properties.)
spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# update, deliberately, and this is the ONE service where that is not a
# violation of the "admin-service is the single DDL owner" rule.
#
# That rule exists because auth-service, admin-service, user-service and
# drive-service all scan org.yuktisetu.db over overlapping entity sets, so two
# of them auto-creating the same table concurrently is a race. notification-dal
# is on exactly one classpath -- this one -- and depends on nothing, so the five
# notification_* tables have a single writer and no other service can race it.
# Hibernate only manages entities it scans, so nothing else in the shared
# database is touched here.
#
# The alternative was putting notification-dal on admin-service purely so the
# DDL owner could create these tables, which would hand the one service that is
# deliberately excluded from notification-service direct write access to its
# tables. Ownership beats uniformity here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Batching for the JPA paths that remain (status flushes on the inbox side).
# The bulk insert paths deliberately bypass Hibernate entirely -- see
# NotificationBatchWriter for why IDENTITY ids make saveAll() unbatchable.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# This service does not use Redis at all -- no locks, no sessions. The health
# indicator would otherwise report DOWN on a perfectly healthy service.
management.health.redis.enabled=false

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

# The shared credential sibling services present on POST /dispatch. Replace per
# environment; an empty value rejects every service call, which is the safe
# default for a laptop.
yuktisetu.notification.service-token=local-dev-service-token

# SMTP -- the same Gmail app-password account admin-service and auth-service
# already use locally.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hardikmahajan97@gmail.com
spring.mail.password=ikxp beln vtfm gaxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=hardikmahajan97@gmail.com

# core's EmailAutoConfiguration reads these. This service does not use core's
# EmailService -- it sends through JavaMailSender directly so it can batch a
# whole chunk into one send() -- but the properties keep the shared config
# consistent if anything in core is wired in later.
app.email.enabled=true
app.email.default-from=hardikmahajan97@gmail.com
app.email.default-from-name=YuktiSetu
app.email.base-invite-url=http://localhost:3000/accept-invite

# The drain sweep. Nothing sends while this is off -- POST /dispatch still
# returns 202 and still logs "Dispatch accepted", the rows just sit at PENDING
# with attempts=0 forever. DrainStartupReporter now says so loudly at boot
# rather than leaving the two states indistinguishable.
#
# ON for local so email is actually testable. The caution it was originally off
# for is real and still applies: this profile points at the shared `yuktisetu`
# database, so whatever is queued WILL be mailed to the real addresses in it
# within one tick of starting the service. Check the queue before booting if a
# blast has been sitting there:
#   select status, count(*) from notification_deliveries group by status;
yuktisetu.notification.drain.enabled=true
yuktisetu.notification.drain.fixed-delay-ms=15000
yuktisetu.notification.drain.batch-size=200
yuktisetu.notification.drain.max-attempts=8
yuktisetu.notification.drain.max-passes-per-tick=5

# Kafka. A local broker runs via `brew services start kafka` (KRaft, no
# ZooKeeper). This service is a CONSUMER only -- it subscribes to the dispatch
# command topic and produces nothing. Turning this off does not break anything:
# the POST /dispatch door keeps working, so the flow stays exercisable without a
# broker.
yuktisetu.kafka.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service.dispatch
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Logging. This service had no logging configuration at all, so it ran at
# Spring's default INFO and the only trace of a dispatch was the two lines
# ingestion writes -- nothing about whether anything ever tried to SEND it.
# DEBUG here narrates the whole path: claim, per-delivery grouping, message
# build, the SMTP call and its timing, then the status write-back.
logging.level.org.yuktisetu.notificationservice=DEBUG

# The batch status write-back (one UPDATE for sent ids, one for failed).
logging.level.org.yuktisetu.notification=DEBUG

# Uncomment to dump the raw SMTP conversation when a send fails for a reason
# the application-level logs cannot explain -- greylisting, TLS, auth. Off by
# default because it prints the AUTH exchange, which carries the app password.
#spring.mail.properties.mail.debug=true

